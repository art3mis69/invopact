<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1e1b4b" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- App Background Tile -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Document Sheet with Folded Corner -->
  <g filter="url(#shadow)">
    <!-- Main page body -->
    <path d="M140 100 L300 100 L372 172 L372 400 A 12 12 0 0 1 360 412 L140 412 A 12 12 0 0 1 128 400 L128 112 A 12 12 0 0 1 140 100 Z" fill="url(#docGrad)" />
    <!-- Folded corner flap -->
    <path d="M300 100 L300 160 A 12 12 0 0 0 312 172 L372 172 Z" fill="#e2e8f0" />
  </g>

  <!-- Header Accent Line -->
  <rect x="172" y="160" width="104" height="14" rx="7" fill="#4f46e5" />

  <!-- Document Text Lines -->
  <rect x="172" y="210" width="168" height="10" rx="5" fill="#94a3b8" />
  <rect x="172" y="240" width="140" height="10" rx="5" fill="#cbd5e1" />
  <rect x="172" y="270" width="168" height="10" rx="5" fill="#cbd5e1" />

  <!-- Subtle Totals / Signature Area -->
  <line x1="172" y1="316" x2="340" y2="316" stroke="#e2e8f0" stroke-width="4" stroke-dasharray="6 4" />
  <rect x="250" y="340" width="90" height="14" rx="7" fill="#10b981" />
  
  <!-- Stylized Pen Nib / Spark Icon in emerald -->
  <circle cx="204" cy="347" r="14" fill="#6366f1" />
  <path d="M200 347 L204 340 L208 347 L204 354 Z" fill="#ffffff" />
</svg>
